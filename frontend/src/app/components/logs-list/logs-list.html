<div class="container mt-4">
  <h3>Журнал действий</h3>

  <!-- Фильтры -->
  <div class="row mb-3 g-2">
    <div class="col-auto">
      <select class="form-select form-select-sm" [(ngModel)]="filterLevel" (change)="onFilter()">
        <option value="">Все уровни</option>
        <option value="Info">Info</option>
        <option value="Warning">Warning</option>
        <option value="Error">Error</option>
      </select>
    </div>
    <div class="col-auto">
      <input type="text" class="form-control form-control-sm" placeholder="Пользователь" 
             [(ngModel)]="filterUser" (input)="onFilter()">
    </div>
    <div class="col-auto">
      <button class="btn btn-outline-secondary btn-sm" (click)="clearFilters()">Сбросить</button>
    </div>
  </div>

  <!-- Таблица -->
  <div class="table-responsive">
    <table class="table table-striped table-hover table-sm">
      <thead class="table-light">
        <tr>
          <th>Время</th>
          <th>Уровень</th>
          <th>Пользователь</th>
          <th>Действие</th>
          <th>Детали</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of logs">
          <td>{{ log.timestamp | date:'short' }}</td>
          <td><span class="badge bg-{{ getLevelBadge(log.level) }}">{{ log.level }}</span></td>
          <td>{{ log.username || '—' }}</td>
          <td>{{ log.action }}</td>
          <td>{{ log.details || '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Пагинация (упрощённая) -->
  <div *ngIf="totalPages > 1" class="d-flex justify-content-center">
    <ul class="pagination pagination-sm">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <a class="page-link" (click)="goToPage(currentPage - 1)">«</a>
      </li>
      <ng-container *ngFor="let p of getPages()">
        <li *ngIf="p !== '...'" class="page-item" [class.active]="p === currentPage">
          <a class="page-link" (click)="goToPage(p)">{{ p }}</a>
        </li>
        <li *ngIf="p === '...'" class="page-item disabled"><span class="page-link">…</span></li>
      </ng-container>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <a class="page-link" (click)="goToPage(currentPage + 1)">»</a>
      </li>
    </ul>
  </div>
</div>
