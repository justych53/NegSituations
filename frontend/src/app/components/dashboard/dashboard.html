<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Дашборд</h2>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card border-start border-primary border-4">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-3 bg-primary bg-opacity-10 p-3">
            <i class="bi bi-clipboard-data text-primary" style="font-size: 1.5rem;"></i>
          </div>
          <div>
            <div class="text-muted" style="font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.025em;">Всего отказов</div>
            <div class="fw-bold" style="font-size: 1.75rem;">{{ totalFailures }}</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card border-start border-info border-4">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="rounded-3 bg-info bg-opacity-10 p-3">
            <i class="bi bi-people text-info" style="font-size: 1.5rem;"></i>
          </div>
          <div>
            <div class="text-muted" style="font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.025em;">Среднее участников</div>
            <div class="fw-bold" style="font-size: 1.75rem;">{{ avgParticipants | number:'1.1-1' }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row" *ngIf="dataLoaded">
    <div class="col-md-6">
      <div class="card mb-4">
        <div class="card-header">Участники с наибольшей ответственностью</div>
        <div class="card-body">
          <div style="position: relative; height: 300px;">
            <canvas baseChart
                    [data]="barChartData"
                    [options]="barChartOptions"
                    [type]="'bar'">
            </canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card mb-4">
        <div class="card-header">Средние веса факторов</div>
        <div class="card-body">
          <div style="position: relative; height: 300px;">
            <canvas baseChart
                    [data]="pieChartData"
                    [options]="pieChartOptions"
                    [type]="'pie'">
            </canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">Веса факторов</div>
        <div class="card-body">
          <table class="table table-hover align-middle">
            <thead>
              <tr><th>Фактор</th><th class="text-end">Средний вес</th></tr>
            </thead>
            <tbody>
              <tr *ngFor="let f of factorAverages">
                <td>
                  <div class="d-flex align-items-center gap-2">
                    <div class="rounded-3 d-flex align-items-center justify-content-center" style="width: 2rem; height: 2rem; background-color: #1e3a5f;">
                      <i class="bi bi-puzzle text-white" style="font-size: 0.875rem;"></i>
                    </div>
                    {{ f.name }}
                  </div>
                </td>
                <td class="text-end fw-medium">
                  <span class="badge fw-bold" style="background-color: #1e3a5f; color: #fff; min-width: 4rem; display: inline-block;">{{ (f.avgWeight * 100) | number:'1.1-1' }}%</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
