<h2>{{ isEdit ? 'Редактировать' : 'Добавить' }} участника</h2>
<form (ngSubmit)="save()">
  <div>
    <label>Имя:</label><br/>
    <input [(ngModel)]="name" name="name" required/>
  </div>
  <div>
    <label>Должность:</label><br/>
    <input [(ngModel)]="position" name="position" required/>
  </div>
  <button type="submit">Сохранить</button>
  <a routerLink="/participants">Отмена</a>
</form>
