<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Записи об отказах</h2>
  <a routerLink="/failures/new" class="btn btn-primary">+ Новый отказ</a>
</div>

<div class="table-responsive">
  <table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th style="width: 5%;">ID</th>
        <th style="width: 20%;">Описание</th>
        <th style="width: 20%;">Результат</th>
        <th style="width: 25%;">Участники</th>
        <th style="width: 30%;">Действия</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of records">
        <td><span class="badge bg-secondary">{{ r.id }}</span></td>
        <td>
          <span class="text-truncate d-inline-block" style="max-width: 200px;" 
                [title]="r.descFailure">
            {{ r.descFailure }}
          </span>
        </td>
        <td>
          <span class="text-truncate d-inline-block" style="max-width: 200px;" 
                [title]="r.resInvest">
            {{ r.resInvest }}
          </span>
        </td>
        <td>
          <ng-container *ngIf="r.participants && r.participants.length > 0; else noParticipants">
            <span *ngFor="let p of r.participants; let i = index" class="badge bg-info me-1">
              {{ p.name }}
            </span>
          </ng-container>
          <ng-template #noParticipants>
            <span class="text-muted">Нет</span>
          </ng-template>
        </td>
        <td class="text-nowrap">
          <a [routerLink]="['/failures', r.id]" class="btn btn-sm btn-outline-info me-1">Просмотр</a>
          <a [routerLink]="['/failures', r.id, 'edit']" class="btn btn-sm btn-outline-warning me-1">Редактирование</a>
          <button (click)="delete(r.id)" class="btn btn-sm btn-outline-danger">Удалить</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="records.length === 0" class="alert alert-info">
  Нет записей об отказах. <a routerLink="/failures/new">Создайте первую запись</a>.
</div>
